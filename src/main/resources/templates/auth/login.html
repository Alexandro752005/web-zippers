<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zippers Perú — Acceso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="zp-login-page">

    <main class="zp-login-wrap">
        <section class="zp-login-card" role="region" aria-label="Acceso al sistema">

            <header class="zp-login-head">
                <div class="zp-login-logo"><i class="fa-solid fa-cube"></i></div>
                <h1 class="zp-login-title">Bienvenido a Zippers Perú</h1>
                <p class="zp-login-subtitle">Ingresa a tu cuenta</p>
            </header>

            <!-- Mensajes de Spring Security -->
            <div th:if="${param.error}" class="alert alert-danger py-2 zp-login-alert" role="alert">
                Usuario o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2 zp-login-alert" role="alert">
                Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post" class="zp-login-form">

                <div class="zp-field">
                    <label class="form-label" for="zp-login-user">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="zp-login-user" name="login" class="form-control"
                               required autofocus maxlength="120" autocomplete="username"
                               placeholder="Usuario o correo">
                    </div>
                </div>

                <div class="zp-field">
                    <label class="form-label" for="zp-password">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="zp-password" name="password" class="form-control"
                               required maxlength="100" autocomplete="current-password"
                               placeholder="••••••••">
                        <button type="button" class="btn btn-outline-secondary zp-eye"
                                id="zp-eye-btn" tabindex="-1" aria-label="Mostrar u ocultar contraseña">
                            <i class="fa-solid fa-eye" id="zp-eye-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary zp-login-btn">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Entrar
                </button>
            </form>

            <footer class="zp-login-foot">© 2026 Zippers Perú · Sistema de administración</footer>
        </section>
    </main>

    <script th:src="@{/js/login.js}"></script>
</body>
</html>
