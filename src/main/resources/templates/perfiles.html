<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Perfiles - Zippers Perú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-light">

    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <nav th:replace="~{layout/navbar :: navbar}"></nav>

    <div id="main-content" class="main-content p-4" style="margin-left: 250px;">
        
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-4 rounded-3 shadow-sm">
            <div>
                <h3 class="fw-bold mb-1"><i class="fas fa-shield-alt me-2 text-secondary"></i> Gestión de Perfiles</h3>
                <p class="text-muted mb-0">Administra los perfiles y permisos del sistema</p>
                <div id="alerta-exito-perfil" class="alert alert-success d-none py-2 mt-2 mb-0 border-0 shadow-sm" style="width: fit-content;">
                    <i class="fas fa-check-circle me-1"></i> <span class="fw-bold">Cambios Guardados con Éxito</span>
                </div>
            </div>
            
            <button class="btn btn-success px-4 py-2 fw-bold shadow-sm" 
                    th:attr="hx-get=@{/dashboard/perfiles/formulario}"
                    hx-target="#modal-content-perfil"
                    hx-swap="innerHTML"
                    sec:authorize="hasRole('ADMIN')">
                <i class="fas fa-plus-circle me-1"></i> Nuevo Perfil
            </button>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3 border-bottom-0">
                <h5 class="m-0 fw-bold text-dark">Lista de perfiles</h5>
            </div>
            <div class="card-body">
                <div id="tabla-perfiles">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle border">
                            <thead class="text-white" style="background-color: #2b5cff;">
                                <tr>
                                    <th class="py-3 px-3 border-0">NOMBRE</th>
                                    <th class="py-3 px-3 border-0">DESCRIPCIÓN</th>
                                    <th class="py-3 px-3 border-0">ESTADO</th>
                                    <th class="py-3 px-3 border-0 text-center">PERMISOS</th>
                                    <th class="py-3 px-3 border-0 text-center">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="rol : ${roles}">
                                    <td class="px-3 text-secondary fw-semibold" th:text="${rol.nombre}">Nombre</td>
                                    <td class="px-3" th:text="${rol.descripcion}">Descripción</td>
                                    <td class="px-3">
                                        <span class="badge px-3 py-2 rounded-pill" 
                                              th:classappend="${rol.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${rol.estado}"></span>
                                    </td>
                                    
                                    <td class="px-3 text-center">
                                        <button class="btn btn-info btn-sm rounded-2 shadow-sm" 
                                                title="Gestionar Permisos"
                                                th:attr="hx-get=@{/dashboard/perfiles/permisos/{id}(id=${rol.id_rol})}"
                                                hx-target="#modal-content-perfil"
                                                hx-swap="innerHTML">
                                            <i class="fas fa-key me-1"></i> Permisos
                                        </button>
                                    </td>
                                    
                                    <td class="px-3 text-center">
                                        <button class="btn btn-primary btn-sm rounded-2 shadow-sm me-1" 
                                                title="Editar Perfil / Reactivar"
                                                th:attr="hx-get=@{/dashboard/perfiles/formulario(id=${rol.id_rol})}"
                                                hx-target="#modal-content-perfil"
                                                hx-swap="innerHTML">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modal-perfil" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content" id="modal-content-perfil">
                    </div>
            </div>
        </div>

        <script>
            document.body.addEventListener('htmx:afterSwap', function(evt) {
                if (evt.detail.target.id === 'modal-content-perfil' && evt.detail.target.querySelector('form')) {
                    var modalEl = document.getElementById('modal-perfil');
                    if (modalEl) {
                        var modalInstance = bootstrap.Modal.getInstance(modalEl);
                        if (!modalInstance) {
                            modalInstance = new bootstrap.Modal(modalEl);
                        }
                        modalInstance.show();
                    }
                }
            });
        </script>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
