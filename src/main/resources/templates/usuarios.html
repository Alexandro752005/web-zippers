<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Zippers Perú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-light">

    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <nav th:replace="~{layout/navbar :: navbar}"></nav>

    <div id="main-content" class="main-content p-4" style="margin-left: 250px;">
        
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-4 rounded-3 shadow-sm">
            <div>
                <h3 class="fw-bold mb-1"><i class="fas fa-users me-2 text-secondary"></i> Gestión de Usuarios</h3>
                <p class="text-muted mb-0">Administra los usuarios del sistema</p>
                <div id="alerta-exito-usuario" class="alert alert-success d-none py-2 mt-2 mb-0 border-0 shadow-sm" style="width: fit-content;">
                    <i class="fas fa-check-circle me-1"></i> 
                    <span class="fw-bold">Cambios Guardados con Éxito</span>
                </div>
            </div>
            <button class="btn btn-success px-4 py-2 fw-bold shadow-sm"
                    th:attr="hx-get=@{/dashboard/usuarios/formulario}"
                    hx-target="#modal-content-usuario"
                    hx-swap="innerHTML"
                    sec:authorize="hasRole('ADMIN')">
                <i class="fas fa-plus-circle me-1"></i> Nuevo Usuario
            </button>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3 border-bottom-0">
                <h5 class="m-0 fw-bold text-dark">Lista de usuarios</h5>
            </div>
            <div class="card-body">
                
                <div class="d-flex justify-content-end mb-3 text-muted">
                    <form th:attr="hx-get=@{/dashboard/usuarios/tabla}"
                          hx-target="#tabla-usuarios"
                          hx-swap="outerHTML"
                          hx-trigger="submit"
                          class="d-flex align-items-center m-0">
                        <span class="me-2 fw-bold text-dark">Buscar:</span>
                        <input type="text" name="buscar" class="form-control form-control-sm me-2" placeholder="Ej: Joel Dávila Ramos" th:value="${buscar}">
                        <button type="submit" class="btn btn-sm btn-primary">Ir</button>
                        <a th:if="${buscar}" th:attr="hx-get=@{/dashboard/usuarios/tabla(buscar='')}" hx-target="#tabla-usuarios" hx-swap="outerHTML" class="btn btn-sm btn-outline-secondary ms-1" title="Limpiar Filtro">
                            <i class="fas fa-times"></i>
                        </a>
                    </form>
                </div>

                <div id="tabla-usuarios">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle border">
                            <thead class="text-white" style="background-color: #2b5cff;">
                                <tr>
                                    <th class="py-3 px-3 border-0">USUARIO / NOMBRE</th>
                                    <th class="py-3 px-3 border-0">EMAIL</th>
                                    <th class="py-3 px-3 border-0">PERFIL</th>
                                    <th class="py-3 px-3 border-0">ESTADO</th>
                                    <th class="py-3 px-3 border-0">FECHA DE CREACIÓN</th>
                                    <th class="py-3 px-3 border-0 text-center">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="usuario : ${usuarios}">
                                    <td class="px-3 text-secondary fw-semibold" th:text="${usuario.nombre_completo}">Nombre</td>
                                    <td class="px-3" th:text="${usuario.email}">correo@zippers.pe</td>
                                    <td class="px-3">
                                        <span class="badge px-3 py-2 rounded-pill" style="background-color: #00c4cc; color: white;" th:text="${usuario.rol.nombre}">PERFIL</span>
                                    </td>
                                    <td class="px-3">
                                        <span class="badge bg-success px-3 py-2 rounded-pill" th:if="${usuario.estado == 'ACTIVO'}">
                                            <i class="fas fa-check-circle me-1"></i> ACTIVO
                                        </span>
                                        <span class="badge bg-secondary px-3 py-2 rounded-pill" th:if="${usuario.estado == 'INACTIVO'}">
                                            <i class="fas fa-user-slash me-1"></i> INACTIVO
                                        </span>
                                    </td>
                                    <td class="px-3 text-capitalize text-muted" th:text="${usuario.fecha_creacion != null ? #temporals.format(usuario.fecha_creacion, 'dd ''de'' MMMM ''de'' yyyy') : 'Fecha no disponible'}">14 de abril de 2026</td>
                                    <td class="px-3 text-center">
                                        <button class="btn btn-primary btn-sm rounded-2 shadow-sm me-1"
                                                th:attr="hx-get=@{/dashboard/usuarios/formulario/{id}(id=${usuario.id_usuario})}"
                                                hx-target="#modal-content-usuario"
                                                hx-swap="innerHTML"
                                                title="Editar Nombre, Email o Perfil">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        
                                        <button th:if="${usuario.rol.nombre == 'ADMIN'}"
                                                class="btn btn-secondary btn-sm rounded-2 shadow-sm" 
                                                title="No permitido"
                                                onclick="alert('¡No permitido! Esta acción no se puede realizar.');">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>

                                        <button th:if="${usuario.rol.nombre != 'ADMIN'}"
                                                class="btn btn-danger btn-sm rounded-2 shadow-sm" 
                                                title="Desactivar Usuario"
                                                th:attr="hx-get=@{/dashboard/usuarios/eliminar/{id}(id=${usuario.id_usuario})}"
                                                hx-target="#modal-content-usuario"
                                                hx-swap="innerHTML"
                                                hx-confirm="¿Estás seguro de desactivar a este usuario?"
                                                sec:authorize="hasRole('ADMIN')">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <nav th:if="${totalPages > 1}" class="mt-4">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a th:attr="hx-get=@{/dashboard/usuarios/tabla(page=${currentPage - 1}, buscar=${buscar})}"
                                   hx-target="#tabla-usuarios"
                                   hx-swap="outerHTML"
                                   class="page-link">
                                    <i class="fas fa-chevron-left"></i>
                                </a>
                            </li>
                            <li class="page-item disabled">
                                <a class="page-link text-dark">Página <span th:text="${currentPage + 1}"></span> de <span th:text="${totalPages}"></span></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a th:attr="hx-get=@{/dashboard/usuarios/tabla(page=${currentPage + 1}, buscar=${buscar})}"
                                   hx-target="#tabla-usuarios"
                                   hx-swap="outerHTML"
                                   class="page-link">
                                    <i class="fas fa-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modal-usuario" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content" id="modal-content-usuario">
                    </div>
            </div>
        </div>

        <script>
            document.body.addEventListener('htmx:afterSwap', function(evt) {
                if (evt.detail.target.id === 'modal-content-usuario' && evt.detail.target.querySelector('form')) {
                    var modalEl = document.getElementById('modal-usuario');
                    if (modalEl) {
                        var modalInstance = bootstrap.Modal.getInstance(modalEl);
                        if (!modalInstance) {
                            modalInstance = new bootstrap.Modal(modalEl);
                        }
                        modalInstance.show();
                    }
                }
            });
        </script>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
