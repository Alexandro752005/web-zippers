<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="tabla-categorias" id="categorias-table-wrap" class="position-relative">
    
    <input type="hidden" id="current-sort" name="sort" th:value="${sort}">
    <input type="hidden" id="current-dir" name="dir" th:value="${dir}">

    <div id="tabla-spinner" class="htmx-indicator">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle border-bottom m-0">
            <thead class="table-light text-secondary">
                <tr>
                    <th class="py-3 px-3 border-0 cursor-pointer sortable-header" style="width: 80px;"
                        th:with="nextDir=${sort == 'id_categoria' and dir == 'asc' ? 'desc' : 'asc'}"
                        th:attr="hx-get=@{/dashboard/categorias(action='list', page=0, sort='id_categoria', dir=${nextDir})}, aria-sort=${sort == 'id_categoria' ? (dir == 'asc' ? 'ascending' : 'descending') : 'none'}"
                        hx-include="#input-buscar, #select-size"
                        hx-target="#categorias-table-wrap" hx-swap="outerHTML" hx-indicator="#tabla-spinner">
                        <div class="d-flex align-items-center justify-content-between">
                            <span th:classappend="${sort == 'id_categoria'} ? 'text-primary fw-bold' : ''">ID</span>
                            <i class="fas" th:classappend="${sort != 'id_categoria'} ? 'fa-sort text-muted opacity-25' : (${dir == 'asc'} ? 'fa-sort-up text-primary' : 'fa-sort-down text-primary')"></i>
                        </div>
                    </th>

                    <th class="py-3 px-3 border-0 cursor-pointer sortable-header"
                        th:with="nextDir=${sort == 'nombre' and dir == 'asc' ? 'desc' : 'asc'}"
                        th:attr="hx-get=@{/dashboard/categorias(action='list', page=0, sort='nombre', dir=${nextDir})}, aria-sort=${sort == 'nombre' ? (dir == 'asc' ? 'ascending' : 'descending') : 'none'}"
                        hx-include="#input-buscar, #select-size"
                        hx-target="#categorias-table-wrap" hx-swap="outerHTML" hx-indicator="#tabla-spinner">
                        <div class="d-flex align-items-center justify-content-between">
                            <span th:classappend="${sort == 'nombre'} ? 'text-primary fw-bold' : ''">NOMBRE</span>
                            <i class="fas" th:classappend="${sort != 'nombre'} ? 'fa-sort text-muted opacity-25' : (${dir == 'asc'} ? 'fa-sort-up text-primary' : 'fa-sort-down text-primary')"></i>
                        </div>
                    </th>

                    <th class="py-3 px-3 border-0">
                        <span class="text-secondary">DESCRIPCIÓN</span>
                    </th>

                    <th class="py-3 px-3 border-0 cursor-pointer sortable-header" style="width: 150px;"
                        th:with="nextDir=${sort == 'estado' and dir == 'asc' ? 'desc' : 'asc'}"
                        th:attr="hx-get=@{/dashboard/categorias(action='list', page=0, sort='estado', dir=${nextDir})}, aria-sort=${sort == 'estado' ? (dir == 'asc' ? 'ascending' : 'descending') : 'none'}"
                        hx-include="#input-buscar, #select-size"
                        hx-target="#categorias-table-wrap" hx-swap="outerHTML" hx-indicator="#tabla-spinner">
                        <div class="d-flex align-items-center justify-content-between">
                            <span th:classappend="${sort == 'estado'} ? 'text-primary fw-bold' : ''">ESTADO</span>
                            <i class="fas" th:classappend="${sort != 'estado'} ? 'fa-sort text-muted opacity-25' : (${dir == 'asc'} ? 'fa-sort-up text-primary' : 'fa-sort-down text-primary')"></i>
                        </div>
                    </th>

                    <th class="py-3 px-3 border-0 text-center" style="width: 120px;">ACCIONES</th>
                </tr>
            </thead>
            
            <tbody>
                <tr th:if="${categorias.empty}">
                    <td colspan="5">
                        <div class="text-center py-5">
                            <div class="mb-3">
                                <i class="fas fa-search fa-3x text-muted opacity-25"></i>
                            </div>
                            <h5 class="fw-bold text-dark">No se encontraron resultados</h5>
                            <p class="text-muted">Intenta buscar con otro término o registra una nueva categoría.</p>
                        </div>
                    </td>
                </tr>

                <tr th:each="cat : ${categorias}">
                    <td class="px-3 text-secondary fw-semibold">#[[${cat.id_categoria}]]</td>
                    <td class="px-3 fw-bold text-dark" th:text="${cat.nombre}"></td>
                    <td class="px-3 text-secondary text-truncate" style="max-width: 250px;" th:text="${cat.descripcion ?: '—'}"></td>
                    <td class="px-3">
                        <span class="badge px-3 py-2 rounded-pill fw-semibold" 
                              th:classappend="${cat.estado == 'ACTIVO'} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${cat.estado}"></span>
                    </td>
                    <td class="px-3 text-center">
                        <button class="btn btn-outline-primary btn-sm rounded-circle me-1"
                                th:attr="hx-get=@{/dashboard/categorias(action='form', id=${cat.id_categoria})}"
                                hx-target="#modal-content-categoria" hx-swap="innerHTML"
                                title="Editar" sec:authorize="hasRole('ADMIN')">
                            <i class="fas fa-pen"></i>
                        </button>
                        
                        <button th:if="${cat.estado == 'ACTIVO'}"
                                class="btn btn-outline-danger btn-sm rounded-circle"
                                th:attr="hx-post=@{/dashboard/categorias(action='delete', id=${cat.id_categoria})}"
                                hx-target="#modal-content-categoria" hx-swap="innerHTML"
                                hx-confirm="¿Estás seguro de desactivar esta categoría?"
                                title="Inactivar" sec:authorize="hasRole('ADMIN')">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between align-items-center p-3" th:if="${totalPages > 0}">
        <small class="text-muted fw-semibold">
            Página <span th:text="${currentPage + 1}"></span> de <span th:text="${totalPages}"></span>
        </small>
        
        <nav aria-label="Navegación de páginas">
            <ul class="pagination pagination-sm m-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" href="javascript:void(0)"
                       th:attr="hx-get=@{/dashboard/categorias(action='list', page=${currentPage - 1}, sort=${sort}, dir=${dir})}"
                       hx-include="#input-buscar, #select-size"
                       hx-target="#categorias-table-wrap" hx-swap="outerHTML" hx-indicator="#tabla-spinner">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>
                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link" href="javascript:void(0)"
                       th:attr="hx-get=@{/dashboard/categorias(action='list', page=${currentPage + 1}, sort=${sort}, dir=${dir})}"
                       hx-include="#input-buscar, #select-size"
                       hx-target="#categorias-table-wrap" hx-swap="outerHTML" hx-indicator="#tabla-spinner">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

</body>
</html>
