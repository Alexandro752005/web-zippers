<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modulo" id="zp-modulo-productos">

  <div class="d-flex justify-content-between align-items-center mb-1">
    <h4 class="mb-0"><i class="fa-solid fa-box me-2 text-primary"></i>Productos</h4>
    <div>
      <button type="button" class="btn btn-light border" disabled title="Próximamente">
        <i class="fa-solid fa-file-export me-1"></i> Exportar
      </button>
      <button type="button" class="btn btn-primary"
              hx-get="/modulo/productos?action=form"
              hx-target="#zp-modal-slot" hx-swap="innerHTML">
        <i class="fa-solid fa-plus me-1"></i> Nuevo producto
      </button>
    </div>
  </div>
  <p class="text-muted mb-3">Catálogo de productos terminados</p>

  <div class="row g-3 mb-3" th:if="${resumen != null}">
    <div class="col-md-3">
      <div class="card"><div class="card-body">
        <div class="small text-muted">Total productos</div>
        <div class="h4 mb-0" th:text="${resumen.totalProductos}">0</div>
      </div></div>
    </div>
    <div class="col-md-3">
      <div class="card"><div class="card-body">
        <div class="small text-muted">Productos activos</div>
        <div class="h4 mb-0 text-success" th:text="${resumen.productosActivos}">0</div>
      </div></div>
    </div>
    <div class="col-md-3">
      <div class="card"><div class="card-body">
        <div class="small text-muted">Marcas registradas</div>
        <div class="h4 mb-0" th:text="${resumen.marcasRegistradas}">0</div>
      </div></div>
    </div>
    <div class="col-md-3">
      <div class="card"><div class="card-body">
        <div class="small text-muted">Precio venta promedio</div>
        <div class="h4 mb-0">S/ <span th:text="${#numbers.formatDecimal(resumen.precioVentaPromedio,1,2)}">0.00</span></div>
      </div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span class="fw-semibold">Catálogo</span>
      <div class="d-flex align-items-center gap-2">
        <select class="form-select form-select-sm" style="width:auto" name="size"
                hx-get="/modulo/productos?action=table&page=0"
                hx-target="#zp-productos-tabla" hx-swap="innerHTML"
                hx-include="[name='q'],[name='estado']">
          <option value="10" selected>10</option>
          <option value="25">25</option>
          <option value="50">50</option>
        </select>
        <select class="form-select form-select-sm" style="width:auto" name="estado"
                hx-get="/modulo/productos?action=table&page=0"
                hx-target="#zp-productos-tabla" hx-swap="innerHTML"
                hx-include="[name='q'],[name='size']">
          <option value="">Todos</option>
          <option value="ACTIVO">Activo</option>
          <option value="SUSPENDIDO">Oculto</option>
          <option value="AGOTADO">Agotado</option>
          <option value="INACTIVO">Inactivo</option>
        </select>
        <input type="text" name="q" class="form-control form-control-sm" style="width:240px"
               placeholder="Buscar por nombre, SKU o marca..."
               hx-get="/modulo/productos?action=table&page=0"
               hx-trigger="keyup changed delay:500ms"
               hx-target="#zp-productos-tabla" hx-swap="innerHTML"
               hx-include="[name='size'],[name='estado']">
      </div>
    </div>
    <div class="card-body p-0">
      <div id="zp-productos-tabla">
        <div th:replace="modules/productos/table :: tabla"></div>
      </div>
    </div>
  </div>

  <div id="zp-modal-slot"></div>
</div>
</body>
</html>
