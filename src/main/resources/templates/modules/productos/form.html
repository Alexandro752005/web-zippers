<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal">
  <div class="modal fade" id="zpModalProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">

        <form id="zpFormProducto" th:hx-post="@{/modulo/productos}"
              hx-target="#zp-productos-tabla" hx-swap="innerHTML">

          <input type="hidden" name="action"
                 th:value="${producto.idProducto} != null ? 'save-editar' : 'save-crear'">
          <input type="hidden" name="idProducto" th:if="${producto.idProducto} != null"
                 th:value="${producto.idProducto}">

          <div class="modal-header">
            <h5 class="modal-title">
              <i class="fa-solid fa-box me-2"></i>
              <span th:text="${producto.idProducto} != null ? 'Editar producto' : 'Nuevo producto'">Producto</span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>

          <div class="modal-body">
            <h6 class="text-uppercase text-muted small">Datos generales</h6>
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">SKU base <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="sku" th:value="${producto.sku}"
                       maxlength="60" placeholder="Ej: 001" required>
              </div>
              <div class="col-md-5">
                <label class="form-label">Nombre <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="nombre" th:value="${producto.nombre}"
                       maxlength="150" placeholder="Ej: Polo blanco Cultura" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Marca</label>
                <input type="text" class="form-control" name="marca" th:value="${producto.marca}"
                       maxlength="80" placeholder="Ej: Zippers">
              </div>

              <div class="col-md-3">
                <label class="form-label">Temporada</label>
                <input type="text" class="form-control" name="temporada" th:value="${producto.temporada}"
                       maxlength="40" placeholder="Ej: Verano">
              </div>
              <div class="col-md-3">
                <label class="form-label">Precio compra <span class="text-danger">*</span></label>
                <input type="number" step="0.01" min="0.01" class="form-control" name="precioCompra"
                       th:value="${producto.precioCompra}" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">Precio venta <span class="text-danger">*</span></label>
                <input type="number" step="0.01" min="0.01" class="form-control" name="precioVenta"
                       th:value="${producto.precioVenta}" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">Stock mínimo <span class="text-danger">*</span></label>
                <input type="number" step="1" min="10" class="form-control" name="stockMinimo"
                       th:value="${producto.stockMinimo} ?: 10" required>
                <div class="form-text">Mínimo permitido: 10</div>
              </div>

              <div class="col-12">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" name="descripcion" rows="2" maxlength="500"
                          placeholder="Polo de tela con diseño moderno."
                          th:text="${producto.descripcion}"></textarea>
              </div>

              <div class="col-md-6">
                <label class="form-label">Categorías</label>
                <select class="form-select" name="categoriaIds" multiple size="4">
                  <option th:each="c : ${categorias}" th:value="${c.idCategoria}"
                          th:text="${c.nombre}"
                          th:selected="${producto.categoriaIds != null and producto.categoriaIds.contains(c.idCategoria)}">Cat</option>
                </select>
                <div class="form-text">Ctrl/Cmd para seleccionar varias.</div>
              </div>
              <div class="col-md-3">
                <label class="form-label">Estado</label>
                <select class="form-select" name="estado">
                  <option value="ACTIVO" th:selected="${producto.estado == 'ACTIVO'}">Activo</option>
                  <option value="SUSPENDIDO" th:selected="${producto.estado == 'SUSPENDIDO'}">Oculto / Borrador</option>
                  <option value="AGOTADO" th:selected="${producto.estado == 'AGOTADO'}">Agotado</option>
                  <option value="INACTIVO" th:selected="${producto.estado == 'INACTIVO'}">Inactivo</option>
                </select>
              </div>
              <div class="col-md-3 d-flex align-items-end">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="zpVisibleWeb"
                         name="visibleWeb" value="true" th:checked="${producto.visibleWeb}">
                  <label class="form-check-label" for="zpVisibleWeb">Visible en catálogo web</label>
                </div>
              </div>
            </div>

            <hr>
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="text-uppercase text-muted small mb-0">Variantes (talla / color)</h6>
              <button type="button" class="btn btn-sm btn-outline-primary" id="zpAddVariante">
                <i class="fa-solid fa-plus me-1"></i> Agregar variante
              </button>
            </div>
            <div class="table-responsive">
              <table class="table table-sm table-bordered align-middle" id="zpTablaVariantes">
                <thead class="table-light">
                  <tr>
                    <th>SKU variante</th><th>Color</th><th>Talla</th>
                    <th>P. compra</th><th>P. venta</th><th>Stock</th><th>Estado</th><th></th>
                  </tr>
                </thead>
                <tbody id="zpVariantesBody">
                  <tr th:each="v,it : ${producto.variantes}">
                    <td>
                      <input type="hidden" th:name="|variantes[${it.index}].idVariante|" th:value="${v.idVariante}">
                      <input class="form-control form-control-sm" th:name="|variantes[${it.index}].skuVariante|" th:value="${v.skuVariante}" required>
                    </td>
                    <td><input class="form-control form-control-sm" th:name="|variantes[${it.index}].color|" th:value="${v.color}"></td>
                    <td><input class="form-control form-control-sm" th:name="|variantes[${it.index}].talla|" th:value="${v.talla}"></td>
                    <td><input type="number" step="0.01" min="0.01" class="form-control form-control-sm" th:name="|variantes[${it.index}].precioCompra|" th:value="${v.precioCompra}" required></td>
                    <td><input type="number" step="0.01" min="0.01" class="form-control form-control-sm" th:name="|variantes[${it.index}].precioVenta|" th:value="${v.precioVenta}" required></td>
                    <td><input type="number" step="1" min="0" class="form-control form-control-sm" th:name="|variantes[${it.index}].stockActual|" th:value="${v.stockActual}"></td>
                    <td>
                      <select class="form-select form-select-sm" th:name="|variantes[${it.index}].estado|">
                        <option value="ACTIVO" th:selected="${v.estado == 'ACTIVO'}">Activo</option>
                        <option value="INACTIVO" th:selected="${v.estado == 'INACTIVO'}">Inactivo</option>
                      </select>
                    </td>
                    <td><button type="button" class="btn btn-sm btn-outline-danger zpDelVar"><i class="fa-solid fa-xmark"></i></button></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div th:if="${producto.idProducto} != null">
              <hr>
              <h6 class="text-uppercase text-muted small">Imágenes (máx 5, 14MB c/u)</h6>
              <div class="input-group" style="max-width:520px">
                <input type="file" class="form-control" id="zpFotoFile" accept="image/png,image/jpeg,image/webp">
                <button type="button" class="btn btn-outline-secondary" id="zpFotoUpload"
                        th:attr="data-pid=${producto.idProducto}">
                  <i class="fa-solid fa-upload me-1"></i> Subir
                </button>
              </div>
              <div class="form-text" id="zpFotoMsg"></div>
            </div>

            <div class="alert alert-light border mt-3 mb-0 small">
              <i class="fa-solid fa-circle-info me-1"></i>
              La acción quedará registrada en el historial de auditoría automáticamente.
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-floppy-disk me-1"></i> Guardar
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script th:inline="javascript">
    (function () {
      var el = document.getElementById('zpModalProducto');
      if (el && window.bootstrap) {
        var m = new bootstrap.Modal(el);
        m.show();
        el.addEventListener('hidden.bs.modal', function () {
          var slot = document.getElementById('zp-modal-slot');
          if (slot) slot.innerHTML = '';
        });
      }

      var body = document.getElementById('zpVariantesBody');
      function reindex() {
        Array.from(body.querySelectorAll('tr')).forEach(function (tr, i) {
          tr.querySelectorAll('[name]').forEach(function (inp) {
            inp.name = inp.name.replace(/variantes\[\d+\]/, 'variantes[' + i + ']');
          });
        });
      }
      function nuevaFila() {
        var i = body.querySelectorAll('tr').length;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><input class="form-control form-control-sm" name="variantes['+i+'].skuVariante" required></td>'+
          '<td><input class="form-control form-control-sm" name="variantes['+i+'].color"></td>'+
          '<td><input class="form-control form-control-sm" name="variantes['+i+'].talla"></td>'+
          '<td><input type="number" step="0.01" min="0.01" class="form-control form-control-sm" name="variantes['+i+'].precioCompra" required></td>'+
          '<td><input type="number" step="0.01" min="0.01" class="form-control form-control-sm" name="variantes['+i+'].precioVenta" required></td>'+
          '<td><input type="number" step="1" min="0" class="form-control form-control-sm" name="variantes['+i+'].stockActual" value="0"></td>'+
          '<td><select class="form-select form-select-sm" name="variantes['+i+'].estado"><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select></td>'+
          '<td><button type="button" class="btn btn-sm btn-outline-danger zpDelVar"><i class="fa-solid fa-xmark"></i></button></td>';
        body.appendChild(tr);
      }
      document.getElementById('zpAddVariante').addEventListener('click', nuevaFila);
      body.addEventListener('click', function (e) {
        var btn = e.target.closest('.zpDelVar');
        if (btn) { btn.closest('tr').remove(); reindex(); }
      });

      var up = document.getElementById('zpFotoUpload');
      if (up) {
        up.addEventListener('click', function () {
          var file = document.getElementById('zpFotoFile').files[0];
          var msg = document.getElementById('zpFotoMsg');
          if (!file) { msg.textContent = 'Seleccione una imagen.'; return; }
          var fd = new FormData();
          fd.append('idProducto', up.getAttribute('data-pid'));
          fd.append('file', file);
          var token = document.cookie.replace(/(?:(?:^|.*;\s*)XSRF-TOKEN\s*=\s*([^;]*).*$)|^.*$/, '$1');
          
          /* 2) FIX: fetch ajustado usando th:inline="javascript" para inyectar el context path */
          var fetchUrl = /*[[@{/modulo/productos/foto}]]*/ '/modulo/productos/foto';
          
          fetch(fetchUrl, {
            method: 'POST', body: fd, headers: { 'X-XSRF-TOKEN': token }
          }).then(function (r) {
            msg.textContent = r.ok ? 'Imagen subida correctamente.' : 'Error al subir la imagen.';
          }).catch(function () { msg.textContent = 'Error de red al subir.'; });
        });
      }
    })();
  </script>
</div>
</body>
</html>
