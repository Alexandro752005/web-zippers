<div xmlns:th="http://www.thymeleaf.org" th:fragment="home" class="zp-module" id="zp-modulo-home">

    <div class="zp-module-head d-flex justify-content-between align-items-end flex-wrap gap-2">
        <div>
            <h1 class="zp-module-title">Panel de Control</h1>
            <p class="zp-module-sub" id="zp-fecha-hoy"></p>
        </div>
    </div>

    <!-- KPIs principales: Ventas hoy / Ventas del mes -->
    <div class="row g-3">
        <div class="col-12 col-lg-6">
            <div class="zp-kpi">
                <div class="zp-kpi-label"><i class="fa-solid fa-cart-shopping text-primary"></i> Ventas de hoy</div>
                <div class="zp-kpi-value">S/ 0.00</div>
                <div class="zp-kpi-foot">Meta diaria: S/ 0.00</div>
                <div class="progress"><div class="progress-bar" role="progressbar" style="width:0%"></div></div>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="zp-kpi">
                <div class="zp-kpi-label"><i class="fa-solid fa-chart-line text-success"></i> Ventas del mes</div>
                <div class="zp-kpi-value">S/ 0.00</div>
                <div class="zp-kpi-foot">Meta mensual: S/ 0.00</div>
                <div class="progress"><div class="progress-bar bg-success" role="progressbar" style="width:0%"></div></div>
            </div>
        </div>
    </div>

    <!-- Tarjetas secundarias -->
    <div class="row g-3 mt-1">
        <div class="col-12 col-md-4">
            <div class="zp-mini">
                <div class="zp-mini-icon bg-warning"><i class="fa-solid fa-file-lines"></i></div>
                <div>
                    <div class="zp-mini-label">Cotizaciones pendientes</div>
                    <div class="zp-mini-value">0</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="zp-mini">
                <div class="zp-mini-icon bg-info"><i class="fa-solid fa-money-check-dollar"></i></div>
                <div>
                    <div class="zp-mini-label">Pagos por verificar</div>
                    <div class="zp-mini-value">0</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="zp-mini">
                <div class="zp-mini-icon bg-secondary"><i class="fa-solid fa-truck"></i></div>
                <div>
                    <div class="zp-mini-label">Envíos pendientes</div>
                    <div class="zp-mini-value">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Top 5 productos más vendidos -->
    <div class="row g-3 mt-1">
        <div class="col-12">
            <div class="zp-panel">
                <div class="zp-panel-head"><i class="fa-solid fa-ranking-star"></i> Top 5 productos más vendidos</div>
                <div class="zp-panel-body">
                    <canvas id="zpTopProductos" height="90"></canvas>
                    <p class="text-muted small mb-0 mt-2">
                        Datos referenciales. Se alimentará del módulo de Ventas (Fase posterior).
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts del dashboard (fecha + gráfico). Chart.js solo en el panel. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
      (function () {
        // Fecha del día en español-Perú
        var f = document.getElementById('zp-fecha-hoy');
        if (f) {
          var hoy = new Date();
          f.textContent = hoy.toLocaleDateString('es-PE', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
          });
        }
        // Gráfico Top 5 (placeholder hasta tener módulo Ventas)
        var cv = document.getElementById('zpTopProductos');
        if (cv && window.Chart) {
          new Chart(cv, {
            type: 'bar',
            data: {
              labels: ['Producto A', 'Producto B', 'Producto C', 'Producto D', 'Producto E'],
              datasets: [{ label: 'Unidades vendidas', data: [0, 0, 0, 0, 0],
                           backgroundColor: '#0d6efd' }]
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
            }
          });
        }
      })();
    </script>
</div>
