<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: documento(~{::seccion})}">
<head>
    <title>Zippers Perú — Backoffice</title>
</head>
<body>
<th:block th:fragment="seccion">
    <div id="zp-modulo-loader"
         th:attr="hx-get=@{|/modulo/${moduloInicial != null ? moduloInicial : 'home'}?action=list|}"
         hx-trigger="load"
         hx-swap="outerHTML">

        <div class="d-flex justify-content-center align-items-center" style="min-height: 50vh;">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Cargando módulo...</span>
            </div>
        </div>

    </div>
</th:block>
</body>
</html>
