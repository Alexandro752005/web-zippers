<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías - Zippers Perú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .cursor-pointer { cursor: pointer; user-select: none; }
        .sortable-header:hover { background-color: #f8f9fa; transition: background 0.2s ease; }
        
        .table-overlay { position: relative; }
        .htmx-indicator { 
            opacity: 0; pointer-events: none; transition: opacity 200ms ease-in; 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255, 255, 255, 0.7); z-index: 10; 
            display: flex; align-items: center; justify-content: center;
        }
        .htmx-request .htmx-indicator { opacity: 1; pointer-events: all; }
        .htmx-request.htmx-indicator { opacity: 1; pointer-events: all; }
    </style>
</head>
<body class="bg-light">

    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <nav th:replace="~{layout/navbar :: navbar}"></nav>

    <div id="main-content" class="main-content p-4" style="margin-left: 250px;">
        
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-4 rounded-3 shadow-sm">
            <div>
                <h3 class="fw-bold mb-1"><i class="fas fa-tags me-2 text-primary"></i> Gestión de Categorías</h3>
                <p class="text-muted mb-0">Administra las categorías del sistema</p>
                <div id="alerta-exito-categoria" class="alert alert-success d-none py-2 mt-2 mb-0 border-0 shadow-sm" style="width: fit-content;">
                    <i class="fas fa-check-circle me-1"></i> <span class="fw-bold">Acción realizada con éxito</span>
                </div>
            </div>
            <button class="btn btn-primary px-4 py-2 fw-bold shadow-sm"
                    th:attr="hx-get=@{/dashboard/categorias(action='form')}"
                    hx-target="#modal-content-categoria"
                    hx-swap="innerHTML"
                    sec:authorize="hasRole('ADMIN')">
                <i class="fas fa-plus-circle me-1"></i> Nueva Categoría
            </button>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3 border-bottom">
                <h5 class="m-0 fw-bold text-dark mb-3">Lista de Categorías</h5>
                
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <span class="text-muted fw-semibold me-2">Mostrar</span>
                        <select id="select-size" name="size" class="form-select form-select-sm text-center shadow-sm cursor-pointer" style="width: 70px;"
                                th:attr="hx-get=@{/dashboard/categorias(action='list', page=0)}"
                                hx-include="#input-buscar, #current-sort, #current-dir"
                                hx-target="#categorias-table-wrap"
                                hx-swap="outerHTML"
                                hx-indicator="#tabla-spinner">
                            <option value="5" th:selected="${size == 5}">5</option>
                            <option value="10" th:selected="${size == 10}">10</option>
                            <option value="25" th:selected="${size == 25}">25</option>
                            <option value="50" th:selected="${size == 50}">50</option>
                        </select>
                        <span class="text-muted fw-semibold ms-2">registros</span>
                    </div>

                    <div class="position-relative" style="width: 300px;">
                        <i class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                        <input type="text" id="input-buscar" name="buscar" class="form-control form-control-sm rounded-pill ps-5 py-2 shadow-sm"
                            placeholder="Buscar categorías..."
                            th:value="${buscar}"
                            th:attr="hx-get=@{/dashboard/categorias(action='list', page=0)}"
                            hx-include="#select-size, #current-sort, #current-dir"
                            hx-target="#categorias-table-wrap"
                            hx-swap="outerHTML"
                            hx-indicator="#tabla-spinner"
                            hx-trigger="input changed delay:400ms, search"
                            aria-label="Buscar categorías">
                    </div>
                </div>
            </div>
            
            <div class="card-body p-0 table-overlay">
                <div th:replace="~{categorias-table :: tabla-categorias}"></div>
            </div>
        </div>

        <div class="modal fade" id="modal-categoria" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow" id="modal-content-categoria"></div>
            </div>
        </div>

        <script>
            document.body.addEventListener('htmx:afterSwap', function(evt) {
                if (evt.detail.target.id === 'modal-content-categoria' && evt.detail.target.querySelector('form')) {
                    var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modal-categoria'));
                    modal.show();
                }
            });

            document.body.addEventListener('categoriaGuardada', function(evt) {
                var modal = bootstrap.Modal.getInstance(document.getElementById('modal-categoria'));
                if (modal) modal.hide();
                
                document.getElementById('alerta-exito-categoria').classList.remove('d-none');
                setTimeout(() => document.getElementById('alerta-exito-categoria').classList.add('d-none'), 3000);
            });
        </script>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
