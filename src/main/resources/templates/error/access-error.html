<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zippers Perú — Aviso</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="zp-error-page">
    <div class="zp-error-box">
        <i class="fa-solid fa-circle-exclamation"></i>
        <h2>Aviso del sistema</h2>
        <p th:text="${mensaje} ?: 'No se pudo completar la operación.'">Mensaje</p>
        <a class="btn btn-primary" th:href="@{/dashboard}">
            <i class="fa-solid fa-arrow-left"></i> Volver al panel
        </a>
    </div>
</body>
</html>
