<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="panel-principal" id="main-content" class="main-content p-4" style="margin-left: 250px; overflow-x: hidden;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0 text-dark"><i class="fas fa-chart-pie me-2 text-primary"></i> Panel de Control</h3>
            <p class="text-muted mb-0 mt-1 small">Resumen general de operaciones de Zippers Perú</p>
        </div>
        <div class="text-end">
            <span class="badge bg-primary px-3 py-2 fs-6 shadow-sm"><i class="far fa-calendar-alt me-1"></i> Hoy: <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span></span>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-xl-6 col-md-6">
            <div class="card border-0 shadow-sm rounded-3 h-100 border-start border-success border-4">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted fw-bold mb-1 small text-uppercase">Ventas de Hoy</p>
                            <h2 class="fw-bold text-dark mb-0" th:text="${'S/ ' + #numbers.formatDecimal(ventasDiarias, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</h2>
                        </div>
                        <div class="bg-success bg-opacity-10 p-3 rounded-circle d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                            <i class="fas fa-hand-holding-usd fa-2x text-success"></i>
                        </div>
                    </div>
                    <p class="mt-3 mb-0 text-muted small"><i class="fas fa-arrow-up text-success me-1"></i> Actualizado en tiempo real</p>
                </div>
            </div>
        </div>

        <div class="col-xl-6 col-md-6">
            <div class="card border-0 shadow-sm rounded-3 h-100 border-start border-primary border-4">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <p class="text-muted fw-bold mb-1 small text-uppercase">Ventas del Mes Actual</p>
                            <h2 class="fw-bold text-dark mb-0" th:text="${'S/ ' + #numbers.formatDecimal(ventasMensuales, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</h2>
                        </div>
                        <div class="bg-primary bg-opacity-10 p-3 rounded-circle d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                            <i class="fas fa-chart-line fa-2x text-primary"></i>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between text-muted small mb-1 mt-3">
                        <span class="fw-bold">Progreso del Mes</span>
                        <span th:text="|Día ${diaActual} de ${totalDiasMes}|">Día X de Y</span>
                    </div>
                    <div class="progress" style="height: 8px;">
                        <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" role="progressbar" 
                             th:style="'width: ' + ${progresoMensual} + '%'" 
                             th:aria-valuenow="${progresoMensual}" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-xl-4 col-md-4">
            <div class="card border-0 shadow-sm rounded-3 bg-white h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="bg-warning bg-opacity-10 p-3 rounded-3 me-3 text-warning">
                        <i class="fas fa-file-invoice-dollar fa-2x"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold text-dark mb-0" th:text="${cotizacionesPendientes}">0</h4>
                        <p class="text-muted small mb-0 fw-bold">Cotizaciones Pendientes</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-md-4">
            <div class="card border-0 shadow-sm rounded-3 bg-white h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="bg-danger bg-opacity-10 p-3 rounded-3 me-3 text-danger">
                        <i class="fas fa-money-check-alt fa-2x"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold text-dark mb-0" th:text="${pagosPendientes}">0</h4>
                        <p class="text-muted small mb-0 fw-bold">Pagos por Verificar</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-md-4">
            <div class="card border-0 shadow-sm rounded-3 bg-white h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="bg-info bg-opacity-10 p-3 rounded-3 me-3 text-info">
                        <i class="fas fa-truck fa-2x"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold text-dark mb-0" th:text="${enviosPendientes}">0</h4>
                        <p class="text-muted small mb-0 fw-bold">Envíos Pendientes</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h5 class="fw-bold text-dark mb-0"><i class="fas fa-crown text-warning me-2"></i> Top 5 Productos Más Vendidos</h5>
                </div>
                <div class="card-body p-4">
                    <div style="position: relative; height: 350px; width: 100%;">
                        <canvas id="topProductosChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script th:inline="javascript">
        // Se ejecuta después de que HTMX inyecta el contenido
        (function() {
            /* Obtenemos los datos inyectados por Spring Boot al modelo */
            const labels = /*[[${chartLabels}]]*/ ['Producto 1', 'Producto 2'];
            const data = /*[[${chartData}]]*/ [10, 20];

            const ctx = document.getElementById('topProductosChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Unidades Vendidas',
                        data: data,
                        backgroundColor: [
                            'rgba(13, 110, 253, 0.7)',  // Primary
                            'rgba(25, 135, 84, 0.7)',   // Success
                            'rgba(13, 202, 240, 0.7)',  // Info
                            'rgba(255, 193, 7, 0.7)',   // Warning
                            'rgba(220, 53, 69, 0.7)'    // Danger
                        ],
                        borderColor: [
                            'rgba(13, 110, 253, 1)',
                            'rgba(25, 135, 84, 1)',
                            'rgba(13, 202, 240, 1)',
                            'rgba(255, 193, 7, 1)',
                            'rgba(220, 53, 69, 1)'
                        ],
                        borderWidth: 1,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            padding: 12,
                            titleFont: { size: 14 },
                            bodyFont: { size: 14 }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { borderDash: [5, 5] }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        })();
    </script>
</div>
</body>
</html>
