<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zippers Perú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    body {
        background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('/images/fondo-zippers.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }
    .card {
        border-radius: 1rem;
        background-color: rgba(255,255,255,0.95); /* un poco de transparencia si quieres */
    }
    .input-group-text {
        background-color: transparent;
        border-right: none;
    }
    .form-control {
        border-left: none;
    }
    .form-control:focus {
        box-shadow: none;
        border-color: #ced4da;
    }
    .input-group:focus-within .input-group-text {
        border-color: #86b7fe;
    }
    .btn-dark {
        transition: all 0.3s ease;
    }
    #alerta-redirigiendo {
        transition: opacity 0.5s ease-in-out;
    }
</style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">

                    <!-- Encabezado -->
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Bienvenido</h2>
                        <p class="text-muted">Ingresa a tu cuenta</p>
                    </div>

                    <!-- Alertas de error / logout / bloqueo -->
                    <div th:if="${param.error}" class="alert alert-danger py-2 text-center text-sm d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-circle-exclamation me-2"></i> Credenciales inválidas.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2 text-center text-sm d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-check-circle me-2"></i> Sesión cerrada correctamente.
                    </div>
                    <div th:if="${param.bloqueado}" class="alert alert-warning py-2 text-center text-sm d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-lock me-2"></i> Cuenta bloqueada por 5 minutos debido a múltiples intentos fallidos.
                    </div>

                    <!-- Alerta de redirigiendo (oculta por defecto) -->
                    <div id="alerta-redirigiendo" class="alert alert-success py-2 text-center d-none align-items-center justify-content-center" role="alert">
                        <i class="fa-solid fa-check-circle me-2"></i> Redirigiendo…
                    </div>

                    <!-- Formulario -->
                    <form id="loginForm" th:action="@{/login}" method="post" novalidate>
                        <!-- Campo Usuario -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="email" class="form-control" id="username" name="username" placeholder="ejemplo@zippers.pe" autofocus required>
                                <div class="invalid-feedback">Por favor ingresa tu correo electrónico.</div>
                            </div>
                        </div>

                        <!-- Campo Contraseña -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="fa-solid fa-eye" id="toggleIcon"></i>
                                </button>
                                <div class="invalid-feedback">Por favor ingresa tu contraseña.</div>
                            </div>
                        </div>

                        <!-- Botón de envío -->
                        <button type="submit" class="btn btn-dark w-100 fw-bold" id="btnLogin">
                            <span id="btnText">Entrar</span>
                            <span id="spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>

                    <!-- Footer -->
                    <div class="text-center mt-4">
                        <small class="text-muted">© 2026 Sistema Zippers Perú</small>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Mostrar/Ocultar contraseña
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        toggleIcon.classList.toggle('fa-eye');
        toggleIcon.classList.toggle('fa-eye-slash');
    });

    // Validación y microinteracción
    const loginForm = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btnLogin');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const alertaRedirigiendo = document.getElementById('alerta-redirigiendo');

    loginForm.addEventListener('submit', function (e) {
        // Prevenir envío siempre para controlar la UX
        e.preventDefault();

        // Validación manual (Bootstrap)
        let valid = true;

        // Validar email
        const emailInput = document.getElementById('username');
        if (!emailInput.value.trim()) {
            emailInput.classList.add('is-invalid');
            valid = false;
        } else {
            emailInput.classList.remove('is-invalid');
        }

        // Validar password
        if (!passwordInput.value) {
            passwordInput.classList.add('is-invalid');
            valid = false;
        } else {
            passwordInput.classList.remove('is-invalid');
        }

        if (!valid) {
            // No enviamos; los mensajes ya están visibles
            return;
        }

        // Si es válido, empezar animación de carga
        btnLogin.disabled = true;
        btnText.textContent = 'Verificando…';
        spinner.classList.remove('d-none');
        alertaRedirigiendo.classList.remove('d-none');
        alertaRedirigiendo.style.opacity = 1;

        // Pequeño retraso para apreciar la animación, luego enviar realmente
        setTimeout(() => {
            loginForm.submit();
        }, 300);
    });
</script>
</body>
</html>
