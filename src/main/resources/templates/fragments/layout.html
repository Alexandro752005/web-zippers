<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="documento(contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zippers Perú — Backoffice</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="zp-app">
        <aside class="zp-sidebar" th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <div class="zp-main">
            <header th:replace="~{fragments/topbar :: topbar}"></header>

            <main id="zp-contenido" class="zp-contenido">
                <div th:replace="${contenido}"></div>
            </main>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="zp-toasts"></div>

    <script th:src="@{/js/htmx.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // 1. Escuchar la orden del backend (zpClose) tras un guardado/edición exitoso
            // El backend responde: {"zpClose": true}
            document.body.addEventListener("zpClose", function() {
                // Capturamos cualquier modal que esté abierto en pantalla
                var modalElement = document.querySelector('.modal.show'); 
                if (modalElement) {
                    var modalInstance = bootstrap.Modal.getInstance(modalElement);
                    if (modalInstance) {
                        modalInstance.hide(); // Bootstrap hace la animación y limpia la pantalla suavemente
                    }
                }
            });

            // 2. Limpieza de emergencia (Brute-force) antes de cambios fuertes en el DOM por HTMX
            // Esto previene que los backdrops queden huérfanos al cambiar rápido de módulos
            document.body.addEventListener("htmx:beforeSwap", function(evt) {
                // Si HTMX va a inyectar un nuevo modal o va a recargar el módulo completo
                if (evt.detail.target.id === 'zp-modal-slot' || evt.detail.target.id === 'zp-contenido') {
                    
                    // a) Destruir físicamente todas las capas grises residuales en el body
                    document.querySelectorAll('.modal-backdrop').forEach(function(backdrop) {
                        backdrop.remove();
                    });
                    
                    // b) Desbloquear el scroll principal de la aplicación
                    document.body.classList.remove('modal-open');
                    document.body.style.removeProperty('overflow');
                    document.body.style.removeProperty('padding-right');
                }
            });
            
        });
    </script>
</body>
</html>
